name: Oracle Ground-Truth Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '50 */4 * * *'

permissions:
  contents: write

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    steps:
      # 1. KÉO MÃ NGUỒN BẰNG SHELL GỐC
      - name: Kéo mã nguồn Oracle
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # 2. HẠ TẦNG CHUẨN HÓA MỚI NHẤT
      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 3. KÍCH HOẠT HẠT NHÂN TỰ PHÔI THAI & THỰC CHỨNG
      - name: Vận hành Trạm Tiên Tri Oracle
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      # 4. LƯU VẾT TÍCH BỌC THÉP VÀO GIT
      - name: Lưu vết toàn bộ cơ quan vừa tự đẻ lên Git
        run: |
          git config --global user.name "Oracle-Truth-Bot"
          git config --global user.email "bot@oracle.node"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          git add -A
          
          if ! git diff --staged --quiet; then
            git commit -m "👁️‍🗨️ [Oracle Truth] Cập nhật chân lý thực tại & Định giá thị trường #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Thực tại tĩnh lặng, không có biến thiên mới."
          fi
